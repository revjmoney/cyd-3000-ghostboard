<svg xmlns="http://www.w3.org/2000/svg" width="360" height="96" viewBox="0 0 360 96" role="img" aria-label="Buy me a coffee">
  <title>Buy me a coffee</title>
  <defs>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF27A"/>
      <stop offset="0.55" stop-color="#FFDD00"/>
      <stop offset="1" stop-color="#F2B800"/>
    </linearGradient>
    <style>
      .halo { animation: pulse 1.6s ease-in-out infinite; transform-origin: 180px 48px; }
      .shine { animation: sweep 3.2s linear infinite; }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.97); } 50% { opacity: 1; transform: scale(1.04); } }
      @keyframes sweep { 0% { transform: translateX(-140px); } 60%, 100% { transform: translateX(420px); } }
      @media (prefers-reduced-motion: reduce) { .halo, .shine { animation: none; } }
    </style>
    <clipPath id="pill"><rect x="30" y="20" width="300" height="56" rx="28"/></clipPath>
  </defs>
  <rect class="halo" x="30" y="20" width="300" height="56" rx="28" fill="#FFDD00" filter="url(#glow)"/>
  <rect x="30" y="20" width="300" height="56" rx="28" fill="url(#face)" stroke="#1a1400" stroke-width="2.5"/>
  <g clip-path="url(#pill)">
    <rect class="shine" x="0" y="10" width="34" height="80" fill="#ffffff" opacity=".45" transform="skewX(-20)"/>
  </g>
  <g transform="translate(56 34)" fill="none" stroke="#1a1400" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 8 h20 v10 a8 8 0 0 1 -8 8 h-4 a8 8 0 0 1 -8 -8 z" fill="#1a1400"/>
    <path d="M22 11 h3 a4 4 0 0 1 0 8 h-3"/>
    <path d="M8 1 q2 2 0 4 M14 1 q2 2 0 4" stroke-width="2"/>
  </g>
  <text x="196" y="57" text-anchor="middle" fill="#1a1400"
        font-family="'Trebuchet MS', 'DejaVu Sans', Verdana, sans-serif" font-size="21" font-weight="800"
        letter-spacing="1.5">BUY ME A COFFEE</text>
</svg>
